# ⚠️ 本文件是 ck-boot-starter 从 JeecgBoot 上游继承下来的 docker-compose，
#    其中的构建上下文 `./jeecg-boot/`、`./jeecgboot-vue3/` **在本仓库并不存在**
#    （本仓库是 ck-server/ + admin-client/ + nuxt-shop/），因此 `docker compose up`
#    目前无法构建成功。要真正启用 Docker 部署，需要先把上下文改成本仓库的实际路径，
#    并确认后端镜像能在容器内拿到私服依赖（cn.cikian:cik-oss 等）。
#    在此之前请把本文件当作参考，不要当作可运行的部署脚本。
# 口令一律从环境变量读取（见根目录 .env.example），仓库里不再保留任何弱口令默认值。
version: '2'
services:
  jeecg-boot-mysql:
    build:
      context: ./jeecg-boot/db
    environment:
      MYSQL_ROOT_PASSWORD: ${COMPOSE_MYSQL_ROOT_PASSWORD:?请先在 .env 中设置 COMPOSE_MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: '%'
      TZ: Asia/Shanghai
    restart: always
    container_name: jeecg-boot-mysql
    image: jeecg-boot-mysql
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --explicit_defaults_for_timestamp=true
      --lower_case_table_names=1
      --max_allowed_packet=128M
      --default-authentication-plugin=caching_sha2_password
    ports:
      - 13306:3306
    healthcheck:
      # 用容器内的 MYSQL_ROOT_PASSWORD（$$ 是 compose 的转义），不再把口令写死在这里
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - jeecg-boot

  jeecg-boot-redis:
    image: registry.cn-hangzhou.aliyuncs.com/jeecgdocker/redis:5.0
    # ports:
    #   - 3792:6379
    restart: always
    hostname: jeecg-boot-redis
    container_name: jeecg-boot-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - jeecg-boot

  jeecg-boot-system:
    build:
      context: ./jeecg-boot/jeecg-module-system/jeecg-system-start
    restart: on-failure
    depends_on:
      # 等依赖服务healthcheck通过后再启动应用（应用Dockerfile已去掉sleep，直接启动）
      jeecg-boot-mysql:
        condition: service_healthy
      jeecg-boot-redis:
        condition: service_healthy
    container_name: jeecg-boot-system
    image: jeecg-boot-system
    hostname: jeecg-boot-system
    ports:
      - 8080:8080
    networks:
      - jeecg-boot
  jeecg-vue:
    build:
      context: ./jeecgboot-vue3
    container_name: jeecgboot-vue3-nginx
    image: jeecgboot-vue3
    depends_on:
      - jeecg-boot-system
    networks:
      - jeecg-boot
    ports:
      - 80:80

  jeecg-boot-pgvector:
    image: registry.cn-hangzhou.aliyuncs.com/jeecgdocker/pgvector
    container_name: jeecg-boot-pgvector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${COMPOSE_POSTGRES_PASSWORD:?请先在 .env 中设置 COMPOSE_POSTGRES_PASSWORD}
      POSTGRES_DB: vector_db
#    ports:
#      - 5432:5432
    restart: always
    networks:
      - jeecg-boot

networks:
  jeecg-boot:
    name: jeecg_boot
