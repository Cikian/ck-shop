# /etc/nginx/sites-available/shop.example.com.conf
# 店铺前台：Nginx → Nitro(127.0.0.1:3001)。SSR 页面、Nitro BFF(/api/*)、sitemap、robots、OG 图全在这里。
# 上线前把 shop.example.com 换成你的域名；证书路径按 certbot 实际签发的域名改。

upstream ck_shop_web {
    server 127.0.0.1:3001;
    keepalive 32;
}

# 80：ACME 校验 + 其余 301 到 https
server {
    listen 80;
    server_name shop.example.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;      # nginx 1.24（Ubuntu 24.04）用这行；≥1.25 也可写 listen 443 ssl; + http2 on;
    server_name shop.example.com;

    ssl_certificate     /etc/letsencrypt/live/shop.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 20m;      # 头像上传后端硬限 8MB（avatar/upload.post.ts:21），留足余量

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # ---- 转发头：BFF 的 CSRF / OAuth / 真实 IP 全靠这几个 ----
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;   # 缺它 → 写操作 403「请求来源校验失败」，HSTS 也失效
    proxy_set_header X-Forwarded-Host  $host;
    # ★ 清掉浏览器自带的 X-Client-IP：BFF 优先采信这个头（clientIp.ts:71-73），不清就能伪造 IP 绕过限流
    proxy_set_header X-Client-IP       "";
    proxy_set_header Connection        "";        # 配合 upstream keepalive
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # 带 hash 的构建产物：一年不可变（Nitro 自己也会下发同样的头）
    location /_nuxt/ {
        proxy_pass http://ck_shop_web;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 其余全交给 Nitro：SSR 页面、/api/*（BFF）、sitemap.xml、robots.txt、/_og/** OG 图
    # ⚠️ 不要给 /api/ 加 proxy_cache：SWR 已由 nuxt.config 的 routeRules 处理，/api/img 缓存会裂图
    location / {
        proxy_pass http://ck_shop_web;
        proxy_buffering off;      # SSR 非流式，开/关都不影响正确性；关掉首字节更早到
    }
}
