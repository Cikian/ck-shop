# /etc/nginx/sites-available/admin.example.com.conf
# 管理后台：静态 dist + 同源 /api/ 反代到 ck-server（Spring context-path 就是 /api，不 rewrite）
# 上线前把 admin.example.com 换成你的域名。

upstream ck_admin_api {
    server 127.0.0.1:9951;
    keepalive 32;
}

server {
    listen 80;
    server_name admin.example.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name admin.example.com;

    root  /opt/ck-shop/admin-client/dist;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/admin.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    server_tokens off;
    client_max_body_size 20m;      # 后端 spring.servlet.multipart 是 10MB，留余量

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    # admin-client 构建时已预生成 .gz（.env.production 的 VITE_BUILD_COMPRESS=gzip），直接发预压缩文件
    gzip_static on;

    # ---------- 后端 API ----------
    location /api/ {
        proxy_pass http://ck_admin_api;        # 末尾不能加 /api/，否则会变成 /api/api/...
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-IP       "";                 # 禁止浏览器伪造客户端 IP
        proxy_set_header Upgrade           $http_upgrade;      # /api/websocket/*（顶栏通知、JVxeTable）
        proxy_set_header Connection        $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_send_timeout    300s;        # AI 对话、报表导出、大文件上传
        proxy_read_timeout    300s;
        proxy_request_buffering off;
    }

    # ---------- 前端静态资源（带 hash，可长缓存） ----------
    location ~ ^/(assets|js|resource|chat)/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # 运行时配置与入口：绝不缓存
    location = /_app.config.js { add_header Cache-Control "no-store"; try_files $uri =404; }
    location = /index.html    { add_header Cache-Control "no-store"; try_files $uri =404; }
    location = /sw.js         { add_header Cache-Control "no-store"; try_files $uri =404; }

    # ---------- SPA history 路由回退 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
